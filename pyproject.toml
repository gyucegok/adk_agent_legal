[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adk-agent-legal"
version = "0.2.0"
description = "Enterprise Legal Analyst Agent powered by Vertex AI RAG 2.0 Serverless and ADK"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Legal Agent Team" }
]
dependencies = [
    "google-agents-cli>=0.1.0",
    "google-adk[gcp,otel-gcp]>=2.6.0,<3.0.0",
    "google-cloud-aiplatform[adk,agent-engines,evaluation]>=1.156.0,<2.0.0",
    "google-genai>=1.0.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.1",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pandas>=2.0.0",
    "httpx>=0.27.0",
    "a2a-sdk[http-server]>=1.0,<2",
    "aiohttp>=3.13.4",
    "gcsfs>=2024.11.0",
    "google-cloud-logging>=3.12.0,<4.0.0",
    "opentelemetry-resourcedetector-gcp<=1.12.0a0",
    "protobuf>=6.31.1,<7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.setuptools]
packages = ["agent_with_rag"]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
